name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ubuntu runners forbid the user namespaces the worker isolation uses.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # RandomX is the C++ library linked through cgo. Linux builds it with
      # the runner's compiler and macOS builds without it (make knows which).
      - if: runner.os != 'Windows'
        run: make test
      # Windows builds it with MSYS2's MinGW-w64 toolchain.
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            make
            git
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          sh scripts/build-randomx.sh windows amd64
          CGO_ENABLED=1 go vet -tags netgo,osusergo ./...
          CGO_ENABLED=1 go test -tags netgo,osusergo ./...
