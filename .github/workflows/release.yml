name: Release

# Pushing a tag such as v0.002-alpha builds every platform and publishes a
# GitHub release. Tags containing "alpha", "beta" or "rc" are pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ubuntu runners forbid the user namespaces the worker isolation uses.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # RandomX is built from source for each platform that has it.
      - name: Install the C and C++ toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ zip \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      # Linux nodes are built static in Alpine containers (make dist); the
      # arm64 one runs under QEMU.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: make test
      - run: make dist VERSION=${GITHUB_REF_NAME#v}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
